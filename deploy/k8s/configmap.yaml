apiVersion: v1
kind: ConfigMap
metadata:
  name: netcopilot-config
  namespace: netcopilot
  labels:
    app: netcopilot

data:
  LOG_LEVEL: "INFO"
  RATE_LIMIT_PER_MIN: "60"
  DEVICE_REGISTRY_PATH: "/app/devices.yaml"
  LLM_PROVIDER: "openai"
  OPENAI_MODEL: "gpt-4.1-mini"
  # LOCAL_LLM_BASE_URL: "http://litellm:4000/v1"
  # LOCAL_LLM_MODEL: "claude-haiku"
  # PROMETHEUS_URL: "http://prometheus:9090"
