apiVersion: v1
kind: Secret
metadata:
  name: netcopilot-secrets
  namespace: netcopilot-prod
  labels:
    app: netcopilot

type: Opaque
stringData:
  OPENAI_API_KEY: "REPLACE_ME"
  CISCO_USER: "REPLACE_ME"
  CISCO_PASS: "REPLACE_ME"
  JUNIPER_USER: "REPLACE_ME"
  JUNIPER_PASS: "REPLACE_ME"
  NOKIA_USER: "REPLACE_ME"
  NOKIA_PASS: "REPLACE_ME"
  # Users/integrations: "key1:admin,key2:noc,key3:noc-ticket" (or configure Auth0 SSO)
  NETCOPILOT_API_KEYS: "REPLACE_ME"
  # Encrypts credentials saved in the Admin UI: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  NETCOPILOT_ENCRYPTION_KEY: "REPLACE_ME"
  # 16+ random characters; placeholders shorter than that are ignored and a random secret is generated
  SESSION_SECRET: "REPLACE_ME"
  TEAMS_HMAC_SECRET: ""
  SLACK_BOT_TOKEN: ""
  SLACK_SIGNING_SECRET: ""
  SLACK_VERIFICATION_TOKEN: ""
  JIRA_BASE_URL: ""
  JIRA_EMAIL: ""
  JIRA_API_TOKEN: ""
  JIRA_PROJECT_KEY: ""
  JIRA_DEFAULT_ISSUE_TYPE: "Task"
  JIRA_DEFAULT_PRIORITY: "Medium"
  JIRA_DEFAULT_TEAM: "NOC"
  ALERT_INGEST_TOKEN: "REPLACE_ME"
