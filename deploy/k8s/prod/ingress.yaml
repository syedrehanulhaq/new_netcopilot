apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: netcopilot
  namespace: netcopilot-prod
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  tls:
    - hosts:
        - netcopilot.example.com
      secretName: netcopilot-tls
  rules:
    - host: netcopilot.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: netcopilot
                port:
                  number: 8001
