# Slack app manifest for NetCopilot.
# api.slack.com/apps → Create New App → From a manifest → paste this file.
#
# Socket Mode (default here): NetCopilot connects out to Slack, so Slack never
# needs to reach NetCopilot — no public URL, tunnel or inbound firewall rule.
# After creating the app:
#   Basic Information → App-Level Tokens → Generate Token and Scopes,
#   add scope connections:write, and put the xapp-… token in SLACK_APP_TOKEN.
#   Install the app and put the xoxb-… bot token in SLACK_BOT_TOKEN.
#
# To use HTTP instead, set socket_mode_enabled: false and add
#   url: https://<netcopilot>/slack/command   (under the slash command)
#   request_url: https://<netcopilot>/slack/actions   (under interactivity)
# and set SLACK_SIGNING_SECRET.
#
# Scopes are the minimum NetCopilot uses:
#   chat:write  post alerts, investigation results and thread replies
#               (invite the app to each channel it posts in)
#   commands    the /netcopilot slash command
display_information:
  name: NetCopilot
  description: Read-only network troubleshooting assistant
  background_color: "#1f2937"
features:
  bot_user:
    display_name: NetCopilot
    always_online: false
  slash_commands:
    - command: /netcopilot
      description: Ask NetCopilot, investigate the latest alert, or open a Jira ticket
      usage_hint: "is BGP up on pe1?  ·  investigate  ·  ticket <summary>"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - chat:write
      - commands
settings:
  interactivity:
    is_enabled: true
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
