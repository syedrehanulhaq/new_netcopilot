apiVersion: v1
kind: Service
metadata:
  name: {{ include "netcopilot.fullname" . }}
  labels:
    app: {{ include "netcopilot.name" . }}

spec:
  selector:
    app: {{ include "netcopilot.name" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: 8001
  type: {{ .Values.service.type }}
