apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "netcopilot.fullname" . }}-devices
  labels:
    app: {{ include "netcopilot.name" . }}

data:
  devices.yaml: |
    cisco_devices:
{{ toYaml .Values.inventory.cisco_devices | indent 6 }}
    juniper_devices:
{{ toYaml .Values.inventory.juniper_devices | indent 6 }}
    nokia_devices:
{{ toYaml .Values.inventory.nokia_devices | indent 6 }}
