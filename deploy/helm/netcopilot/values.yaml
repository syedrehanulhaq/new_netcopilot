image:
  repository: netcopilot
  tag: prod
  pullPolicy: IfNotPresent

# SQLite state on a ReadWriteOnce volume: exactly one replica (see templates/deployment.yaml)
replicaCount: 1

service:
  type: ClusterIP
  port: 8001

ingress:
  enabled: true
  className: nginx
  hosts:
    - host: netcopilot.example.com
      paths:
        - path: /
          pathType: Prefix
  tls:
    - secretName: netcopilot-tls
      hosts:
        - netcopilot.example.com

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 2Gi

persistence:
  enabled: true
  size: 5Gi
  storageClassName: ""

config:
  REDACT_DEVICE_SECRETS: "true"
  AUDIT_RETENTION_DAYS: "365"
  ENABLE_API_DOCS: "false"
  SSH_STRICT_HOST_KEY_CHECKING: "false"  # set true once a known_hosts file is mounted
  LOG_LEVEL: INFO
  RATE_LIMIT_PER_MIN: "120"
  DEVICE_REGISTRY_PATH: /app/devices.yaml
  LLM_PROVIDER: openai
  OPENAI_MODEL: gpt-5.6-sol

secrets:
  NETCOPILOT_API_KEYS: ""        # "key:admin,key2:noc" — or configure Auth0 SSO
  NETCOPILOT_ENCRYPTION_KEY: ""  # Fernet key for credentials saved in the Admin UI
  TEAMS_HMAC_SECRET: ""
  OPENAI_API_KEY: ""
  CISCO_USER: ""
  CISCO_PASS: ""
  JUNIPER_USER: ""
  JUNIPER_PASS: ""
  NOKIA_USER: ""
  NOKIA_PASS: ""
  SESSION_SECRET: ""
  SLACK_BOT_TOKEN: ""
  SLACK_SIGNING_SECRET: ""
  SLACK_VERIFICATION_TOKEN: ""
  JIRA_BASE_URL: ""
  JIRA_EMAIL: ""
  JIRA_API_TOKEN: ""
  JIRA_PROJECT_KEY: ""
  JIRA_DEFAULT_ISSUE_TYPE: "Task"
  JIRA_DEFAULT_PRIORITY: "Medium"
  JIRA_DEFAULT_TEAM: "NOC"
  ALERT_INGEST_TOKEN: ""

inventory:
  cisco_devices: {}
  juniper_devices: {}
  nokia_devices: {}

hpa:
  enabled: false  # requires external state (Postgres) before scaling out
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

pdb:
  enabled: false  # a PDB on a single replica blocks node drains
  minAvailable: 1

networkPolicy:
  enabled: true
  ingressNamespace: ingress-nginx

serviceAccount:
  create: true
  name: ""
