# NetCopilot Device Registry
#
# Format:
#   device_name:
#     host: hostname_or_ip       (required)
#     port: ssh_port             (optional, defaults: SSH=22, NETCONF=830)
#     vendor: cisco|junos|nokia  (required — deterministic routing, no LLM guessing)
#     platform: iosxr|junos|sros (optional, for vendor sub-type)
#     site: site_code            (optional, informational)
#     netconf_port: 830          (optional override)

