<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a8ef2"/>
      <stop offset="100%" stop-color="#6b2bd9"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f7ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#123a7a" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 700 30px 'Sora', 'Manrope', Arial, sans-serif; fill: #0c1426; }
      .label { font: 600 18px 'Manrope', Arial, sans-serif; fill: #0c1426; }
      .text { font: 400 16px 'Manrope', Arial, sans-serif; fill: #516071; }
      .small { font: 400 14px 'Manrope', Arial, sans-serif; fill: #516071; }
      .box { fill: url(#panel); stroke: rgba(12,20,38,0.12); stroke-width: 1.5; rx: 18; }
      .chip { fill: #eef4ff; stroke: rgba(26,142,242,0.2); stroke-width: 1; rx: 10; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="#f6f9ff"/>
  <rect width="1600" height="900" fill="url(#panel)" opacity="0.35"/>

  <text x="80" y="70" class="title">NetCopilot Architecture (High Level)</text>

  <!-- Clients -->
  <rect x="80" y="120" width="280" height="180" class="box" filter="url(#shadow)"/>
  <text x="110" y="160" class="label">Clients</text>
  <text x="110" y="190" class="text">Web UI</text>
  <text x="110" y="215" class="text">Slack / ChatOps</text>
  <text x="110" y="240" class="text">API (curl / tools)</text>

  <!-- API -->
  <rect x="430" y="100" width="390" height="230" class="box" filter="url(#shadow)"/>
  <text x="460" y="140" class="label">NetCopilot API (FastAPI)</text>
  <text x="460" y="170" class="text">Auth + RBAC</text>
  <text x="460" y="195" class="text">Rate limits + audit logs</text>
  <text x="460" y="220" class="text">/chat orchestration</text>
  <text x="460" y="245" class="text">Settings + inventory</text>

  <!-- LLM -->
  <rect x="880" y="100" width="320" height="230" class="box" filter="url(#shadow)"/>
  <text x="910" y="140" class="label">LLM Router</text>
  <text x="910" y="170" class="text">OpenAI / Bedrock / Local</text>
  <text x="910" y="195" class="text">Prompt + tool calling</text>
  <text x="910" y="220" class="text">Policy: read‑only</text>

  <!-- Tools -->
  <rect x="430" y="370" width="770" height="250" class="box" filter="url(#shadow)"/>
  <text x="460" y="410" class="label">Tools + Adapters</text>
  <text x="460" y="440" class="text">Device adapters: IOS XR / Junos / Nokia</text>
  <text x="460" y="465" class="text">Inventory: NetBox / Nautobot / YAML</text>
  <text x="460" y="490" class="text">Ticketing: Jira</text>
  <text x="460" y="515" class="text">Monitoring: Prometheus</text>
  <text x="460" y="540" class="text">Chat: Slack / Teams</text>

  <!-- Data stores -->
  <rect x="80" y="360" width="280" height="260" class="box" filter="url(#shadow)"/>
  <text x="110" y="400" class="label">Local Data Stores</text>
  <text x="110" y="430" class="text">settings.db</text>
  <text x="110" y="455" class="text">memory.db</text>
  <text x="110" y="480" class="text">alerts.db</text>
  <text x="110" y="505" class="text">logs/ (audit)</text>

  <!-- External Systems -->
  <rect x="1230" y="360" width="300" height="260" class="box" filter="url(#shadow)"/>
  <text x="1260" y="400" class="label">External Systems</text>
  <text x="1260" y="430" class="text">Network devices</text>
  <text x="1260" y="455" class="text">Jira / Slack</text>
  <text x="1260" y="480" class="text">Prometheus</text>
  <text x="1260" y="505" class="text">NetBox / Nautobot</text>

  <!-- Arrows -->
  <path d="M360 200 L430 200" stroke="#1a8ef2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M820 200 L880 200" stroke="#6b2bd9" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M625 330 L625 370" stroke="#1a8ef2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M360 460 L430 460" stroke="#1a8ef2" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M1200 460 L1230 460" stroke="#6b2bd9" stroke-width="3" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a8ef2" />
    </marker>
  </defs>

  <rect x="80" y="680" width="1450" height="160" rx="20" fill="url(#accent)"/>
  <text x="110" y="730" font-size="22" font-family="Manrope, Arial, sans-serif" fill="#ffffff" font-weight="600">
    Flow: User asks → LLM selects tool → adapter runs live checks → evidence summarized → response returned
  </text>
  <text x="110" y="765" font-size="16" font-family="Manrope, Arial, sans-serif" fill="#e8f2ff">
    Security: read‑only mode, RBAC, audit logs, rate limits, configurable policies
  </text>
</svg>
