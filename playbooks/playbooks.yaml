# Built-in diagnostic playbooks.
#
# Rule syntax (see playbooks/runner.py):
#   field=value / != / > / < / >= / <=     compare a field in a tool result record
#   cond1 & cond2                          both must hold on the SAME record
#   "tool_name: cond"                      only look at that tool's results
# Evidence fields accept the same "tool_name: field" scoping.
#
# Steps whose inputs are missing (e.g. no interface given) or whose tool is not
# implemented for the device's vendor are skipped, not reported as errors.
# Edits here are re-seeded into playbooks.db automatically on next load.

- name: Interface down/down
  intent: link_down
  tools:
    - get_interface_health
    - check_link
    - get_recent_changes
  evidence_fields:
    - admin_status
    - oper_status
    - last_flapped
    - last_link_flapped
    - active_alarms
    - active_defects
    - input_errors
    - output_errors
    - carrier_transitions
    - assessment
    - "get_recent_changes: last_change"
  severity_rules:
    critical:
      - "get_interface_health: admin_status=up & oper_status=down"
    warning:
      - "get_interface_health: admin_status=down"
  vendor_hints:
    junos: "show interfaces <if> extensive"
    iosxr: "show interface <if>"
    sros: "show port <port> detail"

- name: Interface flapping
  intent: link_flap
  tools:
    - get_interface_health
    - get_interface_counters
    - check_link
    - get_top_flapping_links
  evidence_fields:
    - last_flapped
    - last_link_flapped
    - carrier_transitions
    - crc_errors
    - input_errors
    - output_errors
    - assessment
  severity_rules:
    warning:
      - carrier_transitions>3

- name: High errors / CRC
  intent: crc_errors
  tools:
    - get_interface_health
    - get_interface_counters
    - get_optics
  evidence_fields:
    - crc_errors
    - input_errors
    - output_errors
    - rx_power_dbm
    - tx_power_dbm
  severity_rules:
    warning:
      - crc_errors>0

- name: BGP neighbor down
  intent: bgp_down
  tools:
    - get_bgp_neighbor_status
    - get_bgp_summary
    - get_ping
    - get_recent_changes
  evidence_fields:
    - "get_bgp_neighbor_status: state"
    - last_state
    - last_error
    - last_event
    - last_reset
    - flap_count
    - received_prefixes
    - accepted_prefixes
    - packet_loss_pct
    - "get_recent_changes: last_change"
  severity_rules:
    critical:
      - "get_bgp_neighbor_status: state!=Established"

- name: BGP neighbor Active/Idle
  intent: bgp_active
  tools:
    - get_bgp_neighbor_status
    - get_bgp_summary
    - get_route_lookup
    - get_ping
  evidence_fields:
    - "get_bgp_neighbor_status: state"
    - last_error
    - last_event
    - flap_count
    - "get_route_lookup: found"
    - packet_loss_pct
  severity_rules:
    critical:
      - "get_bgp_neighbor_status: state!=Established"

- name: ISIS adjacency down
  intent: isis_down
  tools:
    - get_isis_neighbors
    - get_isis_interface
    - get_mtu_info
    - get_recent_changes
  evidence_fields:
    - "get_isis_neighbors: state"
    - hold
    - level
    - mtu
    - "get_recent_changes: last_change"
  severity_rules:
    critical:
      - "get_isis_neighbors: state=Down"
      - "get_isis_neighbors: state=Initializing"
      - "get_isis_neighbors: state=Init"
    warning:
      - "get_isis_neighbors: total>0 & up=0"

- name: Routing missing
  intent: route_missing
  tools:
    - get_route_lookup
    - get_bgp_route
    - get_isis_neighbors
    - get_ospf_neighbors
  evidence_fields:
    - "get_route_lookup: found"
    - routes
    - has_default_route
  severity_rules:
    warning:
      - "get_route_lookup: found=false"

- name: High CPU / memory
  intent: cpu_high
  tools:
    - get_cpu_memory
  evidence_fields:
    - cpu_percent
    - memory_used_percent
  severity_rules:
    warning:
      - cpu_percent>80
      - memory_used_percent>80

- name: Chassis/PIC/FPC issue
  intent: hardware_fault
  tools:
    - get_chassis_health
  evidence_fields:
    - has_alarms
    - chassis_alarms
    - fpcs
    - routing_engine
  severity_rules:
    critical:
      - "get_chassis_health: class=Major"
    warning:
      - "get_chassis_health: class=Minor"
      - "get_chassis_health: state=Offline"

- name: Recent configuration change
  intent: config_change
  tools:
    - get_recent_changes
    - get_config_diff
  evidence_fields:
    - "get_recent_changes: last_change"
    - "get_recent_changes: changes"
    - diff
  severity_rules: {}
